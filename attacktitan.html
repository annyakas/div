<html>
    <head>
        <meta charset="UTF-8">
        <title>Attack on titan</title>

        <style>
            .attack-titan {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background-color: #263238;
                color: white;
                border: 3px solid #4e6b45;
                padding: 20px;
                text-align: center;
                width: 280px;
                font-family: Arial, Helvetica, sans-serif;
            }
            .attack-titan h1 {
                color: #b71c1c;
                transition: color 0.3s;
            }
            .attack-titan h1:hover {
                color: #81c784;
                
            }
        </style>
        </head>
        <body>
            <div class="attack-titan">
                <h1>Attack on Titan</h1>
                <h2>A luta pela humanidade</h2>
                <p>
                    A humanidade vive protejida por enormes muralhas <br>
                    para escapar dos titãs. Eren Yeager e seus <br>
                    companheiros lutam pela liberdade.
                </p>
            </div>
        </body>
</html>
